name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.event.release.tag_name }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --dir /tmp/release-assets

      - name: Resolve artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mac_arm_file="engram-${TAG}-aarch64-apple-darwin.tar.gz"
          mac_intel_file="engram-${TAG}-x86_64-apple-darwin.tar.gz"
          linux_file="engram-${TAG}-x86_64-unknown-linux-gnu.tar.gz"

          mac_arm_sha="$(awk -v file="$mac_arm_file" '$2 == file {print $1}' /tmp/release-assets/checksums.txt)"
          mac_intel_sha="$(awk -v file="$mac_intel_file" '$2 == file {print $1}' /tmp/release-assets/checksums.txt)"
          linux_sha="$(awk -v file="$linux_file" '$2 == file {print $1}' /tmp/release-assets/checksums.txt)"

          mac_arm_url="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${mac_arm_file}\") | .browser_download_url")"
          mac_intel_url="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${mac_intel_file}\") | .browser_download_url")"
          linux_url="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${linux_file}\") | .browser_download_url")"

          [[ -n "$mac_arm_sha" && -n "$mac_intel_sha" && -n "$linux_sha" ]]
          [[ -n "$mac_arm_url" && -n "$mac_intel_url" && -n "$linux_url" ]]

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MAC_ARM_URL=$mac_arm_url" >> "$GITHUB_ENV"
          echo "MAC_ARM_SHA=$mac_arm_sha" >> "$GITHUB_ENV"
          echo "MAC_INTEL_URL=$mac_intel_url" >> "$GITHUB_ENV"
          echo "MAC_INTEL_SHA=$mac_intel_sha" >> "$GITHUB_ENV"
          echo "LINUX_URL=$linux_url" >> "$GITHUB_ENV"
          echo "LINUX_SHA=$linux_sha" >> "$GITHUB_ENV"

      - name: Resolve tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tap_repo="${HOMEBREW_TAP_REPO:-${OWNER}/homebrew-tap}"
          echo "TAP_REPO=$tap_repo" >> "$GITHUB_ENV"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${tap_repo}.git" tap

      - name: Render formula
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          bash scripts/render-homebrew-formula.sh \
            "$VERSION" \
            "$OWNER" \
            "${REPO#*/}" \
            "$MAC_ARM_URL" \
            "$MAC_ARM_SHA" \
            "$MAC_INTEL_URL" \
            "$MAC_INTEL_SHA" \
            "$LINUX_URL" \
            "$LINUX_SHA" \
            > tap/Formula/engram.rb

      - name: Commit and push formula
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/engram.rb
          if git diff --cached --quiet; then
            echo "No Homebrew formula changes."
            exit 0
          fi
          git commit -m "engram ${VERSION}"
          git push
